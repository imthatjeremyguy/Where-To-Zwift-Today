name: Tests

# Runs on every push and pull request. The daily data commits are made with
# the Actions token, which doesn't trigger workflows, so they don't run this.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  data-script:
    name: Data script unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

  browser:
    name: Browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run browser tests
        run: node tests/run.js
